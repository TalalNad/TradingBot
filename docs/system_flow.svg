<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" role="img" aria-label="Trading bot system flow diagram">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#394150"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #394150; stroke-width: 2; rx: 8; }
      .store { fill: #edf7ed; stroke: #2d6a4f; stroke-width: 2; rx: 8; }
      .exchange { fill: #fff4e6; stroke: #b45309; stroke-width: 2; rx: 8; }
      .text { font: 16px Arial, sans-serif; fill: #111827; }
      .small { font: 13px Arial, sans-serif; fill: #374151; }
      .line { stroke: #394150; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="30" y="70" width="180" height="76" class="box"/>
  <text x="120" y="101" text-anchor="middle" class="text">TradingView</text>
  <text x="120" y="123" text-anchor="middle" class="small">EMA + RSI Pine Script</text>

  <rect x="260" y="70" width="180" height="76" class="box"/>
  <text x="350" y="101" text-anchor="middle" class="text">Alert</text>
  <text x="350" y="123" text-anchor="middle" class="small">Buy/Sell JSON payload</text>

  <rect x="490" y="70" width="190" height="76" class="box"/>
  <text x="585" y="101" text-anchor="middle" class="text">Flask Webhook</text>
  <text x="585" y="123" text-anchor="middle" class="small">/webhook/tradingview</text>

  <rect x="735" y="70" width="160" height="76" class="box"/>
  <text x="815" y="101" text-anchor="middle" class="text">Validation</text>
  <text x="815" y="123" text-anchor="middle" class="small">Secret, signal, quantity</text>

  <rect x="940" y="70" width="150" height="76" class="exchange"/>
  <text x="1015" y="101" text-anchor="middle" class="text">Binance</text>
  <text x="1015" y="123" text-anchor="middle" class="small">Spot Testnet order</text>

  <rect x="490" y="235" width="190" height="76" class="store"/>
  <text x="585" y="266" text-anchor="middle" class="text">Local Logs</text>
  <text x="585" y="288" text-anchor="middle" class="small">alerts.jsonl + bot.log</text>

  <rect x="735" y="235" width="160" height="76" class="store"/>
  <text x="815" y="266" text-anchor="middle" class="text">Trade History</text>
  <text x="815" y="288" text-anchor="middle" class="small">data/trades.csv</text>

  <path d="M210 108 H260" class="line"/>
  <path d="M440 108 H490" class="line"/>
  <path d="M680 108 H735" class="line"/>
  <path d="M895 108 H940" class="line"/>
  <path d="M585 146 V235" class="line"/>
  <path d="M1015 146 V190 H815 V235" class="line"/>
</svg>
